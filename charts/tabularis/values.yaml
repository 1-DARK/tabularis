# -- External URL the browser uses, e.g. https://tabularis.example.com.
# Required. Must be HTTPS unless it is a localhost URL (port-forwarding).
publicUrl: ""

# -- Extra origins allowed to call the API (the public URL is always allowed).
allowedOrigins: []

image:
  repository: ghcr.io/tabularisdb/tabularis
  # -- debian or alpine
  flavor: debian
  # -- Defaults to the chart appVersion.
  tag: ""
  pullPolicy: IfNotPresent

imagePullSecrets: []

auth:
  # -- password: built-in login page. proxy: an authenticating reverse proxy
  # sends the shared secret in `x-tabularis-proxy-secret`.
  mode: password
  # -- Secret with the keys `web-password`, `proxy-secret` and `secret-key`.
  # When empty the chart creates one and keeps generated values across upgrades.
  existingSecret: ""
  # -- Login password (min. 12 characters); generated when empty.
  password: ""
  # -- Proxy secret (min. 32 characters); generated when empty.
  proxySecret: ""

secretStore:
  # -- Encrypts saved connection credentials on the volume (min. 16
  # characters); generated when empty. Losing it makes them unreadable.
  key: ""

# -- Grants every session host-level operations (plugin management, server
# file access). Only for a single trusted user.
allowHighRisk: false

# -- Server directories the browser may pick files from.
serverFileBrowserRoots: []

# -- Additional environment variables for the container.
extraEnv: []

persistence:
  enabled: true
  existingClaim: ""
  storageClass: ""
  accessModes:
    - ReadWriteOnce
  size: 2Gi

service:
  type: ClusterIP
  port: 8080

ingress:
  enabled: false
  className: ""
  annotations: {}
  # -- The host is taken from publicUrl.
  tls:
    enabled: true
    # -- Defaults to <release>-tls.
    secretName: ""

resources: {}
#  requests:
#    cpu: 100m
#    memory: 256Mi
#  limits:
#    memory: 1Gi

podAnnotations: {}
podLabels: {}

podSecurityContext:
  runAsNonRoot: true
  runAsUser: 10001
  runAsGroup: 10001
  fsGroup: 10001
  seccompProfile:
    type: RuntimeDefault

securityContext:
  allowPrivilegeEscalation: false
  readOnlyRootFilesystem: true
  capabilities:
    drop:
      - ALL

nodeSelector: {}
tolerations: []
affinity: {}
