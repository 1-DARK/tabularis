{{- if not .Values.auth.existingSecret }}
{{- $name := include "tabularis.fullname" . }}
{{- $existing := (lookup "v1" "Secret" .Release.Namespace $name).data | default dict }}
{{- /* Generated values survive upgrades: reuse what the cluster already has. */}}
{{- $password := .Values.auth.password | default (get $existing "web-password" | b64dec) | default (randAlphaNum 24) }}
{{- $proxySecret := .Values.auth.proxySecret | default (get $existing "proxy-secret" | b64dec) | default (randAlphaNum 48) }}
{{- $secretKey := .Values.secretStore.key | default (get $existing "secret-key" | b64dec) | default (randAlphaNum 48) }}
apiVersion: v1
kind: Secret
metadata:
  name: {{ $name }}
  labels:
    {{- include "tabularis.labels" . | nindent 4 }}
  annotations:
    helm.sh/resource-policy: keep
type: Opaque
data:
  web-password: {{ $password | b64enc | quote }}
  proxy-secret: {{ $proxySecret | b64enc | quote }}
  secret-key: {{ $secretKey | b64enc | quote }}
{{- end }}
